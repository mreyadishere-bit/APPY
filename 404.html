<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A missing page — APPY</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/APPY/style.css" />
</head>
<body>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <a class="wordmark" href="/APPY/">APPY</a>
      <p class="masthead-meta">A diary, kept well</p>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="wrap">
        <p class="label">Page 404</p>
        <h1>This page<br />was never written.</h1>
        <p class="lede">
          The address you followed doesn't lead anywhere in APPY. It may have
          been moved, or the link may be incomplete.
        </p>
        <p class="hero-actions">
          <a class="text-link" href="/APPY/">Back to the first page <span aria-hidden="true">→</span></a>
        </p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p class="footer-mark">APPY</p>
      <p class="footer-note">Written on your device, read at your pace.</p>
    </div>
  </footer>

</html>
