<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APPY — a diary kept in books</title>
  <meta name="description" content="APPY is a private diary for everyday life. Write entries into books, group them in folders, search everything instantly, and read your days back as pages that turn. Everything stays on your device." />
  <meta name="theme-color" content="#f5f1e6" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="APPY — a diary kept in books" />
  <meta property="og:description" content="A private diary for everyday life. Books hold entries, folders group them, and everything stays on your device." />
  <meta property="og:image" content="https://mreyadishere-bit.github.io/APPY/og.png" />
  <meta property="og:url" content="https://mreyadishere-bit.github.io/APPY/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="APPY — a diary kept in books" />
  <meta name="twitter:description" content="A private diary for everyday life. Books hold entries, folders group them, and everything stays on your device." />
  <meta name="twitter:image" content="https://mreyadishere-bit.github.io/APPY/og.png" />

  <link rel="canonical" href="https://mreyadishere-bit.github.io/APPY/" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%239c4a2f'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23fff6ee'%3EA%3C/text%3E%3C/svg%3E"
  />

  <script>
    // Paint the chosen theme before the first frame. Preferences only.
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem("appy:settings") || "{}");
        var theme = saved && saved.theme;
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* first run, or storage blocked */
      }
    })();
  </script>

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/reader.css" />
  <link rel="stylesheet" href="styles/landing.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <header class="rail" id="rail" aria-label="APPY"></header>
    <header class="mobile-bar" id="mobileBar"></header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <div class="toast-root" id="toastRoot"></div>

  <noscript>
    <div style="max-width: 34rem; margin: 4rem auto; padding: 2rem; font-family: Georgia, serif">
      <h1>APPY needs JavaScript</h1>
      <p>
        The diary is stored inside your browser, so the page needs JavaScript to open the
        database and lay out the pages. Nothing is sent anywhere. Please enable JavaScript
        for this site and reload.
      </p>
    </div>
  </noscript>

  <script type="module" src="src/main.js"></script>
</body>
</html>
