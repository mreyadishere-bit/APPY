name: Deploy APPY to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find src -type f -name '*.js' -print0)
          echo "Checked $count modules."

      - name: Prepare static site
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::12}"

          rm -rf _site
          mkdir -p _site
          cp -R styles src _site/
          cp index.html 404.html write.html read.html og.png robots.txt sitemap.xml _site/
          touch _site/.nojekyll

          # Version the stylesheets and the module entry in the shell.
          sed -i -E "s|(href=\"styles/[^\"]+\.css)\"|\1?v=${VERSION}\"|g" _site/index.html
          sed -i -E "s|(src=\"src/main\.js)\"|\1?v=${VERSION}\"|g" _site/index.html

          # Version every relative module import, so a deploy is all-or-nothing
          # even with GitHub Pages' ten-minute cache.
          while IFS= read -r -d '' file; do
            sed -i -E "s|(from \"\.{1,2}/[^\"]+\.js)\"|\1?v=${VERSION}\"|g" "$file"
          done < <(find _site/src -type f -name '*.js' -print0)

      - name: Assert the build is complete
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::12}"

          for file in index.html 404.html write.html read.html og.png robots.txt sitemap.xml .nojekyll; do
            test -f "_site/$file" || { echo "Missing _site/$file"; exit 1; }
          done

          for css in tokens base app reader; do
            test -f "_site/styles/$css.css" || { echo "Missing _site/styles/$css.css"; exit 1; }
            grep -q "styles/$css.css?v=${VERSION}" _site/index.html || {
              echo "styles/$css.css is not cache-busted in index.html"; exit 1;
            }
          done

          expected=$(find src -type f -name '*.js' | wc -l)
          shipped=$(find _site/src -type f -name '*.js' | wc -l)
          test "$expected" -eq "$shipped" || {
            echo "Expected $expected modules, shipped $shipped"; exit 1;
          }
          test -f _site/src/main.js
          test -f _site/src/views/reader.js

          grep -q "src/main.js?v=${VERSION}" _site/index.html || {
            echo "src/main.js is not cache-busted in index.html"; exit 1;
          }
          grep -q "\.js?v=${VERSION}" _site/src/main.js || {
            echo "Module imports were not cache-busted"; exit 1;
          }

          # No template markers may survive into the published text. Binary
          # assets (og.png) can contain the same byte pairs, so skip them.
          if grep -rIn \
            --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            --exclude='*.webp' --exclude='*.gif' --exclude='*.ico' \
            --exclude='*.woff' --exclude='*.woff2' \
            -e '{{' _site; then
            echo "Template markers survived the build."
            exit 1
          fi

          echo "Site looks whole."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
