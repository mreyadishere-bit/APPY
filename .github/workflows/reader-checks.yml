name: Reader interaction checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check modules and reader interactions
        run: |
          find src -name '*.js' -exec node --check {} \;
          python3 -m http.server 8123 > /tmp/appy-http.log 2>&1 &
          node tests/reader.spec.mjs
