<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The reading room has moved — APPY</title>
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://mreyadishere-bit.github.io/APPY/" />
  <meta http-equiv="refresh" content="0; url=./#/library" />
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f5f1e8;
      --ink: #23211c;
      --muted: #6c655a;
      --clay: #9c4a2f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17181a;
        --ink: #ece7dc;
        --muted: #a49c8e;
        --clay: #d08a6b;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--paper);
      color: var(--ink);
      font: 1.0625rem/1.6 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    }
    main { max-width: 30rem; }
    p { color: var(--muted); }
    a { color: var(--clay); text-underline-offset: 0.2em; }
    .mark {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 { font-weight: 400; font-size: 2rem; line-height: 1.2; margin: 0.6rem 0 0.8rem; }
  </style>
  <script>
    // Old reading-room anchors pointed at short slugs, not ids. Send people
    // to the shelf; every book there opens in the same reading room.
    (function () {
      try {
        location.replace("./#/library");
      } catch (error) {
        /* the link below still works */
      }
    })();
  </script>
</head>
<body>
  <main>
    <p class="mark">APPY</p>
    <h1>The reading room is part of the diary now.</h1>
    <p>
      Old links to a single page are gone, but every book has a reader.
      Open <a href="./#/library">your library</a> or return to
      <a href="./#/">the front page</a>.
    </p>
  </main>
</body>
</html>
